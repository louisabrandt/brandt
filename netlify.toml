# Netlify configuration for the Brandt site.
# Static Vite build (with SSR prerender), published from dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Long-cache the content-hashed build assets (safe: filenames change on rebuild).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
